services:

  backend:
    build:
      context: ./server
      dockerfile: dockerfile
    container_name: backend-api
    networks:
      - lanbox-network
    volumes:
      - "${STORAGE_PATH}:/app/storage"
    # Match these IDs to the owner of ${STORAGE_PATH} on the host.
    user: "${PUID}:${PGID}"


  frontend:
    build:
      context: ./client
      dockerfile: dockerfile
    container_name: frontend-app
    networks:
      - lanbox-network
    ports:
      - "80:80"


networks:
  lanbox-network:
    driver: bridge

  

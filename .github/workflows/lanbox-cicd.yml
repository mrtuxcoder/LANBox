name: LANBox CI/CD
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint server and client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Lint server
        working-directory: server
        run: npm run lint

  test:
    name: Test server
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: |
          mkdir -p /tmp/lanbox-test-uploads
          STORAGE_PATH=/tmp/lanbox-test-uploads npm test

  
  docker:
    name: Build and Publish Docker Images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 

      - name: Login to GitHub Container Repository
        uses: docker/login-action@v3
        with:
           registry: ghcr.io
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lanbox-server:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lanbox-server:latest

      - name: Build and Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lanbox-client:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lanbox-client:latest

  deploy:
    name: Deploy to homelab
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Create SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
        

      - name: Test SSH connection
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            "$VM_USER@$VM_HOST" \
            "echo Connected! && hostname"

      - name: Copy docker-compose.yml to remote host
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            "$VM_USER@$VM_HOST" \
            "mkdir -p /opt/lanbox"  # Create the directory on the remote host if it doesn't exist

          rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            docker-compose.yml \
            "$VM_USER@$VM_HOST:/opt/lanbox/docker-compose.yml"     # Copy the docker-compose.yml file to the remote host

      - name: Pull Docker images
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            "$VM_USER@$VM_HOST" \
            "cd /opt/lanbox && docker compose pull"

      - name: Start application
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            "$VM_USER@$VM_HOST" \
            "cd /opt/lanbox && docker compose up -d --remove-orphans"
        

      - name: Verify deployment
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            "$VM_USER@$VM_HOST" \
            "cd /opt/lanbox && docker compose ps"
        